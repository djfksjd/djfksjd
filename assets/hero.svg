<svg width="1000" height="340" viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Danny — ALIVE</title>
  <desc id="desc">ALIVE, a brand that brings living things together. KKACHI, STRIX, LUPUS, and SCELIPH form a growing family, with CORVUS, CAMELUS, RAPTOR, and SALTIC planned next.</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: .1em; }
    .pulse { animation: breathe 4s ease-in-out infinite; transform-origin: 797px 153px; }
    @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: .95; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1000" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1714"/><stop offset="1" stop-color="#142A21"/>
    </linearGradient>
    <radialGradient id="halo"><stop stop-color="#B5ED8B" stop-opacity=".13"/><stop offset="1" stop-color="#B5ED8B" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="1000" height="340" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="340" fill="url(#panel)"/>
    <circle cx="797" cy="153" r="245" fill="url(#halo)"/>
    <path d="M48 55H952M48 249H952" stroke="#C9E5D6" stroke-opacity=".14"/>
    <text x="48" y="35" class="mono" font-size="13" fill="#A8BCAF">DANNY / BUILDING ALIVE</text>
    <text x="952" y="35" text-anchor="end" class="mono" font-size="13" fill="#A8BCAF">A GROWING FAMILY</text>
    <text x="43" y="160" font-size="100" font-weight="750" letter-spacing="-.055em" fill="#EAF4DF">ALIVE</text>
    <text x="49" y="207" font-size="23" fill="#C3D7C8">Where living things come together.</text>
    <g stroke="#B5ED8B" stroke-opacity=".22">
      <circle cx="797" cy="153" r="61"/>
      <circle cx="797" cy="153" r="104" stroke-dasharray="3 9"/>
      <path d="M797 153L755 109M797 153L850 125M797 153L807 213M797 153L700 192M797 153L883 211M797 153L824 52"/>
    </g>
    <circle class="pulse" cx="797" cy="153" r="29" fill="#B5ED8B" fill-opacity=".08" stroke="#B5ED8B" stroke-opacity=".5"/>
    <circle cx="797" cy="153" r="8" fill="#B5ED8B"/>
    <g fill="#D1EDA9">
      <circle cx="755" cy="109" r="5"/><circle cx="850" cy="125" r="5"/><circle cx="807" cy="213" r="5"/><circle cx="700" cy="192" r="5"/>
    </g>
    <g fill="#142A21" stroke="#B5ED8B" stroke-opacity=".5">
      <circle cx="883" cy="211" r="5"/><circle cx="824" cy="52" r="5"/><circle cx="705" cy="105" r="5"/><circle cx="898" cy="129" r="5"/>
    </g>
    <text x="49" y="281" class="mono" font-size="15" fill="#D1EDA9">KKACHI / STRIX / LUPUS / SCELIPH</text>
    <text x="49" y="313" class="mono" font-size="13" fill="#A8BCAF">NEXT: CORVUS / CAMELUS / RAPTOR / SALTIC / ...</text>
  </g>
  <rect x=".75" y=".75" width="998.5" height="338.5" rx="23.25" stroke="#385144" stroke-width="1.5"/>
</svg>
